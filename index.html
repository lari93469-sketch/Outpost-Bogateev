<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Форты Брестской крепости — интерактивная карта</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root{
  --bg:#0d0b09;
  --panel-1:rgba(33,26,19,.96);
  --panel-2:rgba(18,14,11,.96);
  --line:#3d3226;
  --khaki:#a8955f;
  --beige:#d8c8a4;
  --brown:#8b6b43;
  --accent:#c9a227;
  --preserved:#7fa650;
  --ruins:#c9772f;
  --abandoned:#8a8a8a;
}

*{box-sizing:border-box;}

html,body{
  margin:0;padding:0;height:100%;
  background:var(--bg);
  color:var(--beige);
  font-family:"Georgia","Times New Roman",serif;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
  background:#0d0b09;
}

/* ================= ПАНЕЛЬ ================= */
.panel{
  position:absolute;
  top:14px;left:14px;
  z-index:1000;
  width:310px;
  max-width:calc(100vw - 28px);
  max-height:calc(100vh - 28px);
  overflow-y:auto;
  background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 14px 44px rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  scrollbar-width:thin;
  scrollbar-color:var(--brown) transparent;
}
.panel::-webkit-scrollbar{width:6px;}
.panel::-webkit-scrollbar-thumb{background:var(--brown);border-radius:3px;}

.panel-head{
  display:flex;align-items:flex-start;gap:10px;
  padding:14px 14px 12px;
  border-bottom:1px solid var(--line);
}
.panel-head .titles{flex:1;min-width:0;}
.panel-head h1{
  margin:0 0 3px;
  font-size:15px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:700;
}
.panel-head p{
  margin:0;
  font-size:11px;
  color:#9c8f74;
  letter-spacing:.03em;
}
.toggle{
  flex:0 0 auto;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(61,50,38,.6);
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--beige);
  cursor:pointer;
  font-size:13px;
  line-height:1;
  transition:.15s;
}
.toggle:hover{background:rgba(139,107,67,.5);}

.panel-body{padding:12px 14px 14px;}
.panel.collapsed .panel-body{display:none;}

.section-title{
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#8a7d63;
  margin:0 0 8px;
}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chip{
  flex:1 1 auto;
  padding:7px 9px;
  font-family:inherit;
  font-size:11.5px;
  letter-spacing:.02em;
  color:var(--beige);
  background:rgba(61,50,38,.45);
  border:1px solid var(--line);
  border-radius:8px;
  cursor:pointer;
  transition:.15s;
  white-space:nowrap;
}
.chip:hover{background:rgba(139,107,67,.45);}
.chip.active{
  background:linear-gradient(180deg,#8b6b43,#61492d);
  border-color:var(--khaki);
  color:#f6ead0;
  box-shadow:0 0 0 1px rgba(201,162,39,.35), 0 4px 12px rgba(0,0,0,.5);
}

/* ================= ЛЕГЕНДА ================= */
.legend{border-top:1px solid var(--line);padding-top:12px;}
.legend-row{
  display:flex;align-items:center;gap:8px;
  font-size:12px;
  color:#c3b593;
  padding:3px 0;
}
.dot{
  width:14px;height:14px;border-radius:50%;
  flex:0 0 auto;
  border:1.5px solid #17120d;
  box-shadow:0 0 0 1.5px rgba(216,200,164,.3);
}
.dot.preserved{background:radial-gradient(circle at 32% 28%,#a7c977,#6f9440 70%);}
.dot.ruins{background:radial-gradient(circle at 32% 28%,#e0a961,#b06f28 70%);}
.dot.abandoned{background:radial-gradient(circle at 32% 28%,#a9a49c,#6f6a63 70%);}
.dot.start{background:radial-gradient(circle at 32% 28%,#f0d97a,#c9a227 70%);}
.line-sample{
  width:20px;height:0;
  border-top:3px solid var(--accent);
  border-radius:2px;
  flex:0 0 auto;
}
.hint{
  margin-top:10px;
  font-size:10.5px;
  line-height:1.5;
  color:#7d7159;
  font-style:italic;
}

/* ================= МАРКЕРЫ ================= */
.fort-marker{
  width:36px;height:36px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:"Georgia",serif;
  font-size:15px;
  font-weight:700;
  color:#17120d;
  border:2px solid #17120d;
  box-shadow:0 0 0 2px rgba(216,200,164,.42), 0 6px 15px rgba(0,0,0,.7);
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease;
  user-select:none;
}
.fort-marker:hover{
  transform:scale(1.16);
  box-shadow:0 0 0 3px rgba(201,162,39,.75), 0 8px 22px rgba(0,0,0,.85);
}
.fort-marker.is-hidden{display:none !important;}

.status-preserved{background:radial-gradient(circle at 32% 28%,#a7c977,#6f9440 70%);}
.status-ruins{background:radial-gradient(circle at 32% 28%,#e0a961,#b06f28 70%);}
.status-abandoned{background:radial-gradient(circle at 32% 28%,#a9a49c,#6f6a63 70%);}

.start-marker{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  background:radial-gradient(circle at 32% 28%,#f0d97a,#c9a227 70%);
  border:2px solid #17120d;
  box-shadow:0 0 0 3px rgba(201,162,39,.35), 0 5px 14px rgba(0,0,0,.7);
}

/* ================= POPUP ================= */
.fort-popup .leaflet-popup-content-wrapper{
  background:linear-gradient(180deg,rgba(36,29,21,.98),rgba(20,16,12,.98));
  color:var(--beige);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 18px 50px rgba(0,0,0,.85);
  padding:0;
}
.fort-popup .leaflet-popup-content{margin:0;width:auto !important;}
.fort-popup .leaflet-popup-tip{
  background:rgba(24,19,14,.98);
  border:1px solid var(--line);
}
.fort-popup .leaflet-popup-close-button{
  color:#9c8f74 !important;
  font-size:20px !important;
  padding:6px 8px 0 0 !important;
  z-index:5;
}
.fort-popup .leaflet-popup-close-button:hover{color:var(--accent) !important;}

.pop-photo{
  height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;
  background:
    repeating-linear-gradient(45deg,rgba(61,50,38,.35) 0 10px,rgba(45,36,27,.35) 10px 20px),
    linear-gradient(180deg,#2b2318,#1a1410);
  border-bottom:1px dashed var(--line);
  border-radius:12px 12px 0 0;
  color:#8a7d63;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.pop-photo span{font-size:22px;opacity:.75;}
.pop-photo small{font-size:9.5px;letter-spacing:.1em;color:#6f6450;text-transform:uppercase;}

.pop-body{padding:12px 14px 14px;}
.pop-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.pop-head h3{
  margin:0;flex:1;
  font-size:14.5px;
  line-height:1.3;
  color:#e8d9b4;
  letter-spacing:.02em;
}
.badge{
  flex:0 0 auto;
  font-size:9.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:3px 7px;
  border-radius:20px;
  border:1px solid;
  white-space:nowrap;
  font-family:Arial,Helvetica,sans-serif;
  margin-top:2px;
}
.b-preserved{color:#a7c977;border-color:#4d6a2c;background:rgba(127,166,80,.13);}
.b-ruins{color:#e0a961;border-color:#7d4d1c;background:rgba(201,119,47,.13);}
.b-abandoned{color:#b0aaa2;border-color:#4f4b45;background:rgba(138,138,138,.13);}

.pop-years{
  font-size:11.5px;
  color:#9c8f74;
  margin-bottom:8px;
  letter-spacing:.02em;
}
.pop-years b{color:var(--khaki);font-weight:700;}

.pop-desc{
  margin:0 0 10px;
  font-size:12.5px;
  line-height:1.55;
  color:#c3b593;
}

.pop-coords{
  font-family:Consolas,Monaco,monospace;
  font-size:10.5px;
  color:#6f6450;
  margin-bottom:11px;
  letter-spacing:.03em;
}

.btn-route{
  width:100%;
  padding:10px 12px;
  font-family:inherit;
  font-size:12.5px;
  letter-spacing:.04em;
  color:#f6ead0;
  background:linear-gradient(180deg,#8b6b43,#5e4629);
  border:1px solid var(--khaki);
  border-radius:9px;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
}
.btn-route:hover{background:linear-gradient(180deg,#a07a4c,#6d5334);}
.btn-route:active{transform:translateY(1px);}
.btn-route[disabled]{opacity:.6;cursor:progress;}

/* ================= ПАНЕЛЬ МАРШРУТА ================= */
.route-info{
  position:absolute;
  left:50%;bottom:20px;
  z-index:1100;
  transform:translate(-50%,160%);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
  display:flex;align-items:center;gap:12px;
  max-width:calc(100vw - 32px);
  padding:11px 12px 11px 16px;
  background:linear-gradient(180deg,rgba(36,29,21,.97),rgba(18,14,11,.97));
  border:1px solid var(--khaki);
  border-radius:11px;
  box-shadow:0 14px 44px rgba(0,0,0,.8);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.route-info.show{transform:translate(-50%,0);}
.ri-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
.ri-text b{
  font-size:12.5px;color:#e8d9b4;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;
}
.ri-text span{font-size:11px;color:var(--khaki);letter-spacing:.03em;}
.ri-close{
  flex:0 0 auto;
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(61,50,38,.6);
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--beige);
  cursor:pointer;
  font-size:12px;
  line-height:1;
  transition:.15s;
}
.ri-close:hover{background:rgba(139,107,67,.6);}

/* ================= LEAFLET ОБЩЕЕ ================= */
.leaflet-control-zoom a{
  background:rgba(33,26,19,.94) !important;
  color:var(--beige) !important;
  border-color:var(--line) !important;
}
.leaflet-control-zoom a:hover{background:rgba(139,107,67,.85) !important;}
.leaflet-control-attribution{
  background:rgba(13,11,9,.82) !important;
  color:#6f6450 !important;
  font-size:9.5px !important;
  font-family:Arial,sans-serif;
  padding:2px 6px !important;
}
.leaflet-control-attribution a{color:#8a7d63 !important;}
.leaflet-control-scale-line{
  background:rgba(13,11,9,.75) !important;
  border-color:#6f6450 !important;
  color:#9c8f74 !important;
  font-family:Arial,sans-serif;
  font-size:9.5px;
}

/* ================= МОБИЛЬНАЯ АДАПТАЦИЯ ================= */
@media (max-width:760px){
  .panel{
    top:10px;left:10px;right:10px;
    width:auto;
    max-height:calc(100vh - 20px);
  }
  .panel-head{padding:12px 12px 10px;}
  .panel-head h1{font-size:13px;}
  .panel-body{padding:10px 12px 12px;}

  .chip{font-size:11px;padding:8px 8px;flex:1 1 40%;}

  .fort-popup .leaflet-popup-content-wrapper{border-radius:12px;}
  .pop-photo{height:80px;}
  .pop-body{padding:11px 12px 13px;}
  .pop-head h3{font-size:13.5px;}
  .pop-desc{font-size:12px;}

  .route-info{
    left:10px;right:10px;
    bottom:10px;
    transform:translate(0,180%);
    max-width:none;
  }
  .route-info.show{transform:translate(0,0);}
  .ri-text b{max-width:60vw;}

  .leaflet-control-zoom{display:none;}
}

@media (max-height:520px){
  .panel{max-height:calc(100vh - 16px);}
  .pop-photo{height:64px;}
}
</style>
</head>

<body>

<div id="map"></div>

<!-- ======================= БОКОВАЯ ПАНЕЛЬ ======================= -->
<aside class="panel" id="panel">
  <div class="panel-head">
    <div class="titles">
      <h1>Форты Брестской крепости</h1>
      <p>Брест-Литовская крепость · 1880—1915</p>
    </div>
    <button class="toggle" id="panelToggle" title="Свернуть/развернуть">▾</button>
  </div>

  <div class="panel-body">
    <p class="section-title">Фильтр по статусу</p>
    <div class="chips" id="filters">
      <button class="chip active" data-filter="all">Все</button>
      <button class="chip" data-filter="preserved">Сохранённые</button>
      <button class="chip" data-filter="ruins">Руины</button>
      <button class="chip" data-filter="abandoned">Заброшенные</button>
    </div>

    <div class="legend">
      <p class="section-title">Легенда</p>
      <div class="legend-row"><span class="dot preserved"></span> Сохранён</div>
      <div class="legend-row"><span class="dot ruins"></span> Руины</div>
      <div class="legend-row"><span class="dot abandoned"></span> Заброшен</div>
      <div class="legend-row"><span class="dot start"></span> Центр Бреста (старт)</div>
      <div class="legend-row"><span class="line-sample"></span> Маршрут до форта</div>
      <p class="hint">
        Нажмите на маркер форта, чтобы увидеть описание, год постройки
        и построить маршрут от центра города.
      </p>
    </div>
  </div>
</aside>

<!-- ======================= ПАНЕЛЬ МАРШРУТА ======================= -->
<div class="route-info" id="routeInfo">
  <div class="ri-text">
    <b id="riTitle">—</b>
    <span id="riMeta">—</span>
  </div>
  <button class="ri-close" id="riClose" title="Убрать маршрут">✕</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================================
   1. ДАННЫЕ
   ========================================================================= */

const BREST_CENTER = [52.0976, 23.7341];   // центр Бреста

const STATUS = {
  preserved: { label: 'Сохранён'  },
  ruins:     { label: 'Руины'     },
  abandoned: { label: 'Заброшен'  }
};

const FORTS = [
  {
    id: 1, num: '1',
    name: 'Форт №1 «Казимир-Великий»',
    lat: 52.1050, lng: 23.7610,
    years: '1880–1883',
    status: 'preserved',
    desc: 'Первый форт внешнего обвода Брест-Литовской крепости, возведённый для прикрытия северо-восточного направления. Кирпично-бетонные казематы, горжевая казарма и валы частично уцелели до наших дней. Объект охраняется как памятник фортификационного искусства.'
  },
  {
    id: 2, num: '2',
    name: 'Форт №2 «Ляховичи»',
    lat: 52.0830, lng: 23.7870,
    years: '1881–1884',
    status: 'ruins',
    desc: 'Форт восточного сектора обороны, построенный по типовому проекту 1879 года. В годы Первой мировой войны вёл артиллерийский огонь по наступающим австро-германским войскам. Ныне — живописные руины среди зарослей и оплывших земляных валов.'
  },
  {
    id: 3, num: '3',
    name: 'Форт №3 «Шерешево»',
    lat: 52.0720, lng: 23.8200,
    years: '1882–1885',
    status: 'ruins',
    desc: 'Один из фортов восточного фронта крепости, усиленный бетонными казематами в начале XX века. Сильно пострадал в 1915 году при отходе русских войск. Сохранились фрагменты стен, пороховых погребов и крепостных рвов.'
  },
  {
    id: 4, num: '4',
    name: 'Форт №4 «Граф Берг»',
    lat: 52.0550, lng: 23.7800,
    years: '1882–1886',
    status: 'preserved',
    desc: 'Форт юго-восточного сектора, названный в честь генерал-фельдмаршала Ф. В. фон Берга. Отличается хорошо сохранившейся горжевой казармой и системой потерн. Используется как площадка для исторических реконструкций.'
  },
  {
    id: 5, num: '5',
    name: 'Форт №5 «Великая Княгиня Елена Павловна»',
    lat: 52.0390, lng: 23.7560,
    years: '1883–1886',
    status: 'abandoned',
    desc: 'Самый крупный форт южного обвода, возведённый с применением бетона и броневых наблюдательных постов. Прикрывал подступы к Тереспольскому укреплению. Сегодня заброшен, внутренние помещения частично затоплены.'
  },
  {
    id: 6, num: '6',
    name: 'Форт №6 «Граф Пален»',
    lat: 52.0280, lng: 23.7100,
    years: '1884–1887',
    status: 'ruins',
    desc: 'Форт юго-западного направления, названный в честь генерала от кавалерии П. П. фон дер Палена. В 1915 году гарнизон оставил укрепление, взорвав часть казематов. До наших дней дошли руины казармы и оплывшие валы.'
  },
  {
    id: 7, num: '7',
    name: 'Форт №7 «Заречье»',
    lat: 52.0450, lng: 23.6750,
    years: '1885–1888',
    status: 'abandoned',
    desc: 'Форт западного сектора, стоявший на берегу Мухавца у Заречного предместья. Служил для обороны железнодорожного моста и дамбы. Ныне заброшен, сохранились отдельные казематы и остатки кирпичной кладки.'
  },
  {
    id: 8, num: '8',
    name: 'Форт №8 «Литовск»',
    lat: 52.0650, lng: 23.6450,
    years: '1886–1889',
    status: 'preserved',
    desc: 'Форт юго-западного фронта, замыкавший внешний обвод крепости. Имел мощные бетонные укрытия и артиллерийские позиции. Сильно разрушен в ходе боёв XX века, ныне — руины среди лесопарковой зоны.'
  }
];

/* =========================================================================
   2. КАРТА
   ========================================================================= */

const map = L.map('map', {
  center: BREST_CENTER,
  zoom: 12,
  minZoom: 9,
  maxZoom: 18,
  zoomControl: false,
  attributionControl: true,
  zoomSnap: 0.5,
  wheelPxPerZoomLevel: 90
});

/* Тёмная подложка (CARTO Dark Matter на данных OpenStreetMap) */
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);
L.control.scale({ position: 'bottomleft', imperial: false, maxWidth: 130 }).addTo(map);

/* Стартовая точка — центр Бреста */
const startIcon = L.divIcon({
  className: '',
  html: '<div class="start-marker">★</div>',
  iconSize: [26, 26],
  iconAnchor: [13, 13]
});

const startMarker = L.marker(BREST_CENTER, {
  icon: startIcon,
  zIndexOffset: -100,
  interactive: true
}).addTo(map);
startMarker.bindTooltip('Центр Бреста — начало маршрута', { direction: 'top', offset: [0, -14] });

/* =========================================================================
   3. МАРКЕРЫ ФОРТОВ
   ========================================================================= */

const markersGroup = L.layerGroup().addTo(map);
const markerById = {};

function makeFortIcon(fort) {
  return L.divIcon({
    className: '',
    html: `<div class="fort-marker status-${fort.status}">${fort.num}</div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -22]
  });
}

function popupHtml(f) {
  return `
    <div class="pop">
      <div class="pop-photo" title="Здесь будет фотография форта">
        <span>📷</span>
        <small>место для фотографии</small>
      </div>
      <div class="pop-body">
        <div class="pop-head">
          <h3>${f.name}</h3>
          <span class="badge b-${f.status}">${STATUS[f.status].label}</span>
        </div>
        <div class="pop-years">Год постройки: <b>${f.years}</b></div>
        <p class="pop-desc">${f.desc}</p>
        <div class="pop-coords">${f.lat.toFixed(4)}° N, ${f.lng.toFixed(4)}° E</div>
        <button class="btn-route" data-id="${f.id}">🧭 Маршрут от центра Бреста</button>
      </div>
    </div>`;
}

FORTS.forEach(fort => {
  const marker = L.marker([fort.lat, fort.lng], {
    icon: makeFortIcon(fort),
    title: fort.name,
    riseOnHover: true
  });

  marker.bindPopup(popupHtml(fort), {
    maxWidth: 320,
    minWidth: 262,
    className: 'fort-popup',
    autoPanPadding: [40, 40],
    closeButton: true
  });

  marker.bindTooltip(fort.name, {
    direction: 'top',
    offset: [0, -20],
    className: 'fort-tooltip'
  });

  marker.fortId = fort.id;
  markerById[fort.id] = marker;
  markersGroup.addLayer(marker);
});

/* Кнопка «Маршрут» внутри попапа */
map.on('popupopen', e => {
  const el = e.popup.getElement();
  const btn = el && el.querySelector('.btn-route');
  if (!btn) return;

  btn.addEventListener('click', () => {
    const fort = FORTS.find(f => f.id === Number(btn.dataset.id));
    if (fort) buildRoute(fort);
  });
});

/* =========================================================================
   4. ФИЛЬТР ПО СТАТУСУ
   ========================================================================= */

let activeFilter = 'all';

document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;

  activeFilter = chip.dataset.filter;

  document.querySelectorAll('#filters .chip').forEach(c => c.classList.toggle('active', c === chip));

  FORTS.forEach(fort => {
    const marker = markerById[fort.id];
    const visible = (activeFilter === 'all' || fort.status === activeFilter);

    if (visible) {
      if (!markersGroup.hasLayer(marker)) markersGroup.addLayer(marker);
    } else {
      if (markersGroup.hasLayer(marker)) markersGroup.removeLayer(marker);
      marker.closePopup();
    }
  });
});

/* =========================================================================
   5. МАРШРУТ ОТ ЦЕНТРА БРЕСТА ДО ФОРТА
   ========================================================================= */

let routeLine = null;
let routeStartMarker = null;

const routeInfoEl = document.getElementById('routeInfo');
const riTitle = document.getElementById('riTitle');
const riMeta = document.getElementById('riMeta');

function formatDistance(m) {
  return m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' км'
                   : Math.round(m) + ' м';
}

function formatDuration(sec) {
  const min = Math.round(sec / 60);
  if (min < 60) return '~' + min + ' мин';
  const h = Math.floor(min / 60), m = min % 60;
  return '~' + h + ' ч' + (m ? ' ' + m + ' мин' : '');
}

function clearRoute() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (routeStartMarker) { map.removeLayer(routeStartMarker); routeStartMarker = null; }
  routeInfoEl.classList.remove('show');
}

document.getElementById('riClose').addEventListener('click', clearRoute);
map.on('popupclose', () => { /* маршрут остаётся, пока пользователь не закроет */ });

async function buildRoute(fort) {
  clearRoute();

  const btn = document.querySelector(`.btn-route[data-id="${fort.id}"]`);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Строю маршрут…'; }

  const from = BREST_CENTER;
  const to = [fort.lat, fort.lng];

  let coords = null, distance = null, duration = null, fallback = false;

  try {
    const url = 'https://router.project-osrm.org/route/v1/driving/'
      + `${from[1]},${from[0]};${to[1]},${to[0]}`
      + '?overview=full&geometries=geojson';

    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    if (data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('no route');

    const route = data.routes[0];
    coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
    distance = route.distance;
    duration = route.duration;
  } catch (err) {
    /* Офлайн / сервис недоступен — рисуем прямую линию */
    fallback = true;
    coords = [from, to];
    distance = map.distance(from, to) * 1.25; // грубая поправка на дороги
    duration = null;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🧭 Маршрут от центра Бреста'; }
  }

  /* Линия маршрута */
  routeLine = L.polyline(coords, {
    color: '#c9a227',
    weight: fallback ? 3 : 4,
    opacity: 0.92,
    dashArray: fallback ? '9 9' : null,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(map);

  /* Стартовый маркер маршрута */
  routeStartMarker = L.marker(from, {
    icon: L.divIcon({
      className: '',
      html: '<div class="start-marker">★</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    }),
    zIndexOffset: 500
  }).addTo(map).bindTooltip('Старт: центр Бреста', { direction: 'top', offset: [0, -14] });

  /* Подгоняем вид под маршрут */
  map.fitBounds(routeLine.getBounds(), {
    paddingTopLeft: [40, 40],
    paddingBottomRight: [40, 40],
    maxZoom: 14,
    animate: true
  });

  /* Информационная панель */
  riTitle.textContent = fort.name;
  riMeta.textContent = `${formatDistance(distance)} · ${duration ? formatDuration(duration) : 'время не рассчитано'}`
                     + (fallback ? ' · прямая линия' : '');
  routeInfoEl.classList.add('show');
}

/* =========================================================================
   6. СВОРАЧИВАНИЕ ПАНЕЛИ (мобильные)
   ========================================================================= */

const panel = document.getElementById('panel');
const panelToggle = document.getElementById('panelToggle');

function updateToggleIcon() {
  panelToggle.textContent = panel.classList.contains('collapsed') ? '▸' : '▾';
}

panelToggle.addEventListener('click', () => {
  panel.classList.toggle('collapsed');
  updateToggleIcon();
});

/* На маленьких экранах панель стартует свёрнутой */
if (window.innerWidth <= 760) {
  panel.classList.add('collapsed');
}
updateToggleIcon();

/* =========================================================================
   7. ПРОЧЕЕ
   ========================================================================= */

/* Закрываем попап и панель маршрута по Esc */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { map.closePopup(); }
});

/* Пересчёт размеров карты при повороте экрана */
window.addEventListener('orientationchange', () => {
  setTimeout(() => map.invalidateSize(), 250);
});

/* Стартовый обзор всех фортов */
map.fitBounds(L.latLngBounds(FORTS.map(f => [f.lat, f.lng])), {
  padding: [50, 50],
  maxZoom: 13
});
</script>
</body>
</html>
